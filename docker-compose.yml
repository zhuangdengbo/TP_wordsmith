services:
  db:
    build: ./db
    container_name: wordsmith-db
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - wordsmith-network

  words:
    build: ./words
    container_name: wordsmith-words
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - wordsmith-network

  web:
    build: ./web
    container_name: wordsmith-web
    depends_on:
      - words
    ports:
      - "80:80"
    networks:
      - wordsmith-network

volumes:
  db_data:

networks:
  wordsmith-network:
    driver: bridge
